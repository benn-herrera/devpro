<!doctype html>
<!-- Written by devpro's profiler (`devpro profiler tree --format html`). The standalone render fetches nothing and runs from the file the flow wrote. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>devpro — profiler view: session</title>
<!--DECO-->
<!--LAYER-->
<style>
:root { --panel:#fff; --track:#f1f2f0; --fresh:#8d969e;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --sans: system-ui, -apple-system, "Segoe UI", sans-serif; }
@media (prefers-color-scheme: dark) { :root { --panel:#1b2025; --track:#20262b; --fresh:#79828a; } }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 var(--sans); padding:24px max(16px, 3vw); }
h1 { font-size:18px; margin:0 0 2px; } h2 { font-size:14px; margin:22px 0 8px; }
.sub { color:var(--muted); font:12px var(--mono); margin-bottom:10px; white-space:nowrap; }
.intro { max-width:760px; margin:0 0 14px; color:var(--fg); }
.intro summary { cursor:pointer; color:var(--muted); font-size:12px; }
.intro p { margin:6px 0 0; }
.chip { width:12px; height:12px; border-radius:3px; display:inline-block; flex:none; align-self:center; }
.symbols { display:flex; flex-wrap:wrap; gap:6px 20px; font-size:12px; color:var(--muted); margin:0 0 14px; }
.symbols span { display:inline-flex; align-items:center; gap:6px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; overflow-x:auto; }
svg { display:block; } svg text { font:12px var(--sans); fill:var(--fg); } svg .muted { fill:var(--muted); font-size:11px; }
svg .head { fill:#fff; font-weight:600; } svg .head.on-accent { fill:var(--on-accent); } @media (prefers-color-scheme: dark) { svg .head.on-palette { fill:var(--on-accent); } } svg .head.sub { font-weight:400; font-size:11px; fill-opacity:.9; } svg .head.chip { font-size:11px; } svg .mono { font-family:var(--mono); } svg .failtext { fill:var(--c0); font-weight:600; }
svg .kind { fill:var(--muted); font-weight:400; } svg .spent text { font-weight:600; } svg .spent text.kind { font-weight:400; }
svg .hit { cursor:pointer; } svg .hit:hover rect, svg .hit:hover path { stroke:var(--fg); stroke-width:1.5; }
svg .flabel { font:11px var(--sans); fill:#fff; pointer-events:none; } svg .failed rect { fill-opacity:.4; } svg .failed .flabel { fill:var(--fg); }
svg .spawn rect { stroke:var(--panel); stroke-width:1; }
.toolbar { margin:0 0 8px; display:flex; align-items:center; gap:16px; font-size:13px; color:var(--muted); }
.tree { font:13px/1.45 var(--mono); }
.row, .thead { display:grid; grid-template-columns:8ch 7ch 66px 6.5ch 7.5ch 6.5ch minmax(0, 1fr); column-gap:10px; align-items:baseline; padding:3px 6px; border-radius:4px; }
.row { cursor:pointer; } .row.mark { cursor:default; } .tree .muted { color:var(--muted); } .thead { color:var(--muted); font-size:12px; border-bottom:1px solid var(--line); border-radius:0; margin-bottom:2px; }
.num { text-align:right; color:var(--muted); } .bar { height:6px; align-self:center; display:flex; } .bar i { height:6px; border-radius:2px; }
.call { display:flex; gap:8px; align-items:baseline; min-width:0; }
.row:hover, .row.sel { background:color-mix(in srgb, var(--fg) 7%, transparent); }
.call > * { flex:none; } .row .words, .row .gist, .mark { color:var(--muted); } .row .fail { color:var(--c0); font-weight:600; }
.row .gist { flex:1 1 0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.detail { margin:2px 0 8px; padding:8px 10px; border-left:3px solid var(--line); white-space:pre-wrap; word-break:break-word; }
.detail b { color:var(--muted); font-weight:500; display:inline-block; min-width:64px; }
</style></head><body>
<nav class="site-nav scanlines"><span class="brand">devpro</span><span class="views"><a class="view" href="/board/">kanban</a><a class="view active" href="/profiler/" aria-current="page">profiler</a></span><span class="nav-server">
  <span class="dot"></span>
  <span id="connection" role="status" aria-labelledby="connection"></span>
  <button id="stop" class="nav-stop" type="button">Stop</button>
</span></nav>
<div class="frame-band scanlines"><!--LEGEND--><!--DISPATCHED--><!--RETURN--></div>
<h1>Session <span id="sid"></span></h1>
<div class="sub" id="subline"></div>

<div class="toolbar"><label><input type="checkbox" id="all"> every tool call</label><span>Without it: skills, subagents and compactions, like the <code>tree</code> command — or every tool call when the session has none of those.</span></div>
<div class="panel"><svg id="tl" role="img" aria-label="Sequence diagram, one lifeline per context"></svg></div>
<h2>Call tree</h2>
<div class="tree" id="tree"></div>
<script>
'use strict';
(() => {
const D = /*DATA*/null;
const PALETTE = 8;
const SEQ_GUTTER = 130, SEQ_RIGHT = 120, SEQ_COL = 230, SEQ_HEAD = 54, SEQ_ROW = 40, CHAR_W = 6.6;
// A context's token counts take three text rows below its call (y to y + 40);
// the next row's label starts 17 px above its line, so the row after such a
// call moves down to y + 62 and nothing ever draws over the counts.
const SEQ_SPENT_ROW = 62, LABEL_PAD = 12;
const esc = (t) => String(t).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const clip = (t, n) => (t.length > n ? t.slice(0, n - 1) + '…' : t);
// The moments' and durations' one notation, the deco's global (`devproFormat`): this page carries no
// formatter of its own.
const { localDay, clock, dur, scaled } = globalThis.devproFormat;
// A header item is a span of its own, so the line is read item by item and never joined into a single
// string that could break inside one; the header keeps it on one line (`.sub`).
const item = (text) => { const span = document.createElement('span'); span.textContent = text; return span; };
// A background call with no end recorded yet has no duration to show.
const took = (c) => (c.running ? 'running' : dur(c.dur));
const tok = (n) => scaled(n) + ' tok';
const count = scaled;
// A session's or a context's models as its line words them: the id where its calls recorded one, their
// count where several, and the empty string where none — every caller prefixes its own separator, so a
// record that names no model shows no empty one.
const modelPhrase = (models) => (!models || !models.length ? '' : models.length === 1 ? models[0] : `${models.length} models`);
const modelCalls = (n) => `${n} model call${n === 1 ? '' : 's'}`;
const spentTip = (c) => `${c.label}: ${modelCalls(c.spent.calls)}, each sending the context's whole history again.\n`
  + `${c.spent.new} new input tokens (plain input and cache writes)\n${c.spent.cached} read from the prompt cache\n${c.spent.out} output tokens\n`
  + 'A cache read reuses work the model already did for that prefix, so it costs less than new input; output costs the most.';
const spentOf = (id) => (byId.get(id) || {}).spent;
const KIND_WORDS = { Skill: 'skill', Agent: 'agent' };
const kindWord = (tool) => KIND_WORDS[tool] || tool;
// A call's name as the page renders it: an Agent call's set prefix dropped, every other name as
// recorded — a Bash command's `devpro-check-plan` is that command. `AGENT_PREFIX` is the one line
// `pages.AGENT_PREFIX_LINE` holds, filled here at the render.
/*AGENT_PREFIX*/
const shownName = (tool, n) => (n && tool === 'Agent' ? n.replace(AGENT_PREFIX, '') : n || '');
// The way back carries the page's own query: the index's row links bring it here, and the list opened
// at it stands as the reader left it — the controls' state and the sort in force.
const back = document.querySelector('.frame-band a.return');
if (back) back.href = back.pathname + location.search;
// The name leads and the kind follows, quieter: review (skill).
const label = (tool, n) => (shownName(tool, n) ? `${shownName(tool, n)} (${kindWord(tool)})` : kindWord(tool));
const byId = new Map(D.contexts.map((c) => [c.id, c]));
// The root keeps the id `main` on every page; its name is the page's to give — read after `byId`, a
// dispatched session's root being named for the call that dispatched it.
const short = (id) => (id === 'main' ? byId.get('main').label : id.slice(0, 6));
const callOf = new Map(D.calls.map((c, i) => [c.child, i]).filter(([child]) => child));
const order = new Map(D.contexts.map((c, i) => [c.id, i]));
// Hue 0 is the root context — a page nothing dispatched — and its copies: the accent, its labels in
// the token that reads on it. Every other hue is the palette's own color, and no palette hue reads as
// the accent in either mode. The root's own bar takes a stroke in the layer's `--line`, so it reads
// as a surface against the panel in the light mode, where the accent is under 3:1 on white.
const hueColor = (h) => (h === 0 ? 'var(--accent)' : `var(--c${h % PALETTE})`);
const color = (id) => hueColor(byId.get(id) ? byId.get(id).hue : 0);
// A header's labels read on its own fill: the dark token on the accent, and on every palette hue in
// the dark mode, where each of the palette's colors is light enough that white text is unreadable.
const headClass = (id) => (byId.get(id) ? byId.get(id).hue : 0) === 0 ? ' on-accent' : ' on-palette';
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ROOT_BAR = `stroke="${css('--line')}" stroke-width="1"`;
const kindText = (c) => c.kind === 'root' ? 'the session itself'
  : c.kind === 'copy' ? `starts with a copy of ${byId.get(c.parent) ? byId.get(c.parent).label : 'its parent'}'s history`
  : c.parent ? '' : 'its parent call was not recorded';
const gist = (c) => [c.args && c.args !== c.name ? `(${c.args})` : '', c.result && (c.child || !c.ok) ? `-> ${c.result}` : ''].filter(Boolean).join(' ');
const words = (call) => {
  if (!call.child) return call.tool === 'Skill' ? 'inline' : '';
  const child = byId.get(call.child);
  return `new context ${short(call.child)}${child && child.kind === 'copy' ? `, copy of ${short(call.ctx)}` : ''}${call.background ? ', background' : ''}`;
};

document.getElementById('sid').textContent = D.session.slice(0, 8);
const starts = D.calls.map((c) => c.start).concat(D.markers.map((m) => m.at));
const first = Math.min(...starts);
// The header's stamp is the session's first call as a `<time>`, drawn local at birth: the reader's
// clock, 24-hour, with its date — the page's title names no day — the machine form its `datetime`, as
// on every moment the pages show. No second pass reads it: a page whose script does not run carries
// no moment.
const head = document.getElementById('subline');
if (Number.isFinite(first)) {
  const at = new Date(first);
  const moment = document.createElement('time');
  moment.dateTime = at.toISOString();
  moment.textContent = `${localDay(at)} ${clock(at)}`;
  head.append(moment);
}
// One separator before the joined items, none inside them: a branch, the counts, the model phrase
// led by the model's own word, and — where the records carry the operational-context stamp — the
// plan's title and the directives digest — never an empty tail from a session that recorded none.
const facts = [D.branch && `branch ${D.branch}`, `${D.calls.length} calls`, `${D.contexts.length} contexts`, modelPhrase(D.models) && `model ${modelPhrase(D.models)}`, D.plan && `plan ${D.plan}`, D.directives && `directives ${D.directives.slice(0, 12)}`].filter(Boolean);
if (Number.isFinite(first)) head.append(item(' · '));
facts.forEach((text, i) => head.append(item(`${i ? ' · ' : ''}${text}`)));
// The fan-out mark: in the header line that heads this session, the reader told that its trace
// records no review of the agents it dispatched before its first dispatch — the mark that stands on
// the index row of the session it was the dispatcher's fan-out of.
if (D.unreviewed) head.append(item(' · unreviewed fan-out'));

// ---------- sequence diagram: one lifeline per context ----------

// Rows are events in time order, not to scale: a spawn is a call message to the
// new context's lifeline, its end a dashed return with the result. Tool calls
// and inline skills are self-messages; a compaction is a note on its lifeline.
function sequenceEvents(all) {
  const ev = [];
  D.calls.forEach((c, i) => {
    if (c.child && byId.has(c.child)) {
      ev.push({ t: c.start, k: 0, type: 'call', i, from: c.ctx, to: c.child });
      if (!c.running) ev.push({ t: c.start + c.dur, k: 2, type: 'return', i, from: c.child, to: c.ctx });
    } else if (c.tool === 'Skill' || all) {
      ev.push({ t: c.start, k: 1, type: 'self', i, at: c.ctx });
    }
  });
  for (const m of D.markers) if (m.kind === 'compact') ev.push({ t: m.at, k: 1, type: 'note', m, at: m.ctx });
  ev.sort((a, b) => a.t - b.t || a.k - b.k);
  return groupInline(ev);
}

// Inline skills loaded one after another in one context share a diamond until
// clicked open: their order matters less than the calls they lead to.
const GROUP_MIN = 3;
const expanded = new Set();
const isInline = (e) => e.type === 'self' && D.calls[e.i].tool === 'Skill';
function groupInline(ev) {
  const out = [];
  for (let k = 0; k < ev.length;) {
    let j = k;
    while (j < ev.length && isInline(ev[j]) && ev[j].at === ev[k].at) j += 1;
    if (j - k >= GROUP_MIN && !expanded.has(ev[k].i)) {
      out.push({ t: ev[k].t, type: 'group', at: ev[k].at, is: ev.slice(k, j).map((e) => e.i) });
      k = j;
    } else {
      out.push(...ev.slice(k, Math.max(j, k + 1)));
      k = Math.max(j, k + 1);
    }
  }
  return out;
}

// One column per context at a time: a context takes the first column right of
// its caller's whose last context ended before it started, so contexts that
// never overlap, like repeated runs of one skill, share a column.
function packColumns(rows, rowOf) {
  const span = (c) => (c.id === 'main' ? [0, Infinity] : [rowOf.get(`call${callOf.get(c.id)}`) ?? 0, rowOf.get(`return${callOf.get(c.id)}`) ?? Infinity]);
  const ends = [], col = new Map(), members = [];
  for (const c of D.contexts) {
    const [from, to] = span(c);
    let k = c.id === 'main' ? 0 : (col.get(c.parent) ?? 0) + 1;
    while (k < ends.length && ends[k] >= from) k += 1;
    ends[k] = to; col.set(c.id, k);
    (members[k] = members[k] || []).push(c);
  }
  return { col, members };
}

// The default view falls back to every call when it would otherwise draw none, as `drawTree`'s
// does, so a session of nothing but tool calls shows those calls here too, and the checkbox
// short-circuits the fallback.
function drawSequence() {
  const requested = document.getElementById('all').checked;
  const asSkillAndAgent = (c) => c.tool === 'Skill' || c.tool === 'Agent';
  const fallback = !requested && !D.calls.some(asSkillAndAgent) && !D.markers.some((m) => m.kind === 'compact');
  const svg = document.getElementById('tl');
  const rows = sequenceEvents(requested || fallback);
  const rowOf = new Map();
  rows.forEach((e, r) => { if (e.type === 'call' || e.type === 'return') rowOf.set(`${e.type}${e.i}`, r); });
  const { col, members } = packColumns(rows, rowOf);
  const n = members.length;
  const colW = Math.max(SEQ_COL, (svg.parentElement.clientWidth - 26 - SEQ_GUTTER - SEQ_RIGHT) / n);
  const W = SEQ_GUTTER + colW * n + SEQ_RIGHT;
  const colX = (k) => SEQ_GUTTER + colW * k + colW / 2;
  const lx = new Map(D.contexts.map((c) => [c.id, colX(col.get(c.id))]));
  const ys = [SEQ_HEAD + 18];
  rows.forEach((e, r) => {
    const spent = e.type === 'call' && (byId.get(e.to) || {}).spent;
    ys.push(ys[r] + (spent ? SEQ_SPENT_ROW : SEQ_ROW));
  });
  const yOf = (r) => ys[r];
  const height = yOf(rows.length) + 10;
  const fits = (px) => Math.max(4, Math.floor(px / CHAR_W));

  let s = `<text class="muted" x="8" y="24">time</text>`;
  const tipOf = (c) => [
    `${c.label}${c.id === 'main' ? '' : ` (${short(c.id)})`}`,
    kindText(c),
    ...(c.models || []),
  ].filter(Boolean).join('\n');
  members.forEach((list, k) => {
    const x = colX(k), first = list[0];
    s += `<line x1="${x}" x2="${x}" y1="${SEQ_HEAD}" y2="${height}" stroke="${css('--line')}" stroke-dasharray="4 4"/>`;
    const box = `x="${x - colW / 2 + 8}" y="4" width="${colW - 16}" height="${SEQ_HEAD - 10}" rx="6"`;
    if (new Set(list.map((c) => color(c.id))).size > 1) { s += sharedHeader(list, x, box); return; }
    // One context, or copies that share their parent's color: a solid header.
    const name = shownName(first.tool, first.name) || first.label;
    const title = list.length === 1 ? name : `${name} ×${list.length}`;
    const sub = list.length === 1
      ? clip((first.id === 'main' ? 'main context' : `${kindWord(first.tool)} · ${short(first.id)}${first.kind === 'copy' ? ` · copy of ${short(first.parent)}` : first.parent ? '' : ' · parent not recorded'}`) + (first.models.length ? ` · ${modelPhrase(first.models)}` : ''), fits(colW - 30))
      : `${list.length} contexts, one after another`;
    s += `<g><rect ${box} fill="${color(first.id)}"/>`
      + `<text class="head${headClass(first.id)}" x="${x}" y="24" text-anchor="middle">${esc(clip(title, fits(colW - 30)))}</text>`
      + `<text class="head sub${headClass(first.id)}" x="${x}" y="40" text-anchor="middle">${esc(sub)}</text>`
      + `<title>${esc(list.map(tipOf).join('\n'))}</title></g>`;
  });
  // Contexts of different colors took turns in this column, so no one color
  // can fill its header: an outline holds a chip per context, in time order
  // and in the color of its bar. A name is written once per run of it, and
  // names shorten together until the row fits:
  //   validator, github          => [validator] [github]
  //   validator ×3               => [validator] [] []
  //   five long names, 230 px    => [wat…] [est…] [val…] [fork] [val…]
  function sharedHeader(list, x, box) {
    const PAD = 6, GAP = 4, avail = colW - 32;
    const plain = list.map((c) => shownName(c.tool, c.name) || c.label);
    const names = plain.map((chip, i) => (i && chip === plain[i - 1] ? '' : chip));
    const bare = Math.max(2, Math.min(14, (avail - GAP * (list.length - 1)) / list.length));
    const widths = (n) => names.map((name) => (name && n > 1 ? Math.min(name.length, n) * CHAR_W + PAD * 2 : bare));
    const total = (n) => widths(n).reduce((a, b) => a + b, 0) + GAP * (list.length - 1);
    let n = Math.max(...names.map((name) => name.length));
    while (n > 1 && total(n) > avail) n -= 1;
    let cx = x - total(n) / 2;
    const chips = list.map((c, i) => {
      const w = widths(n)[i], text = names[i] && n > 1 ? clip(names[i], n) : '';
      const chip = `<g><rect x="${cx}" y="10" width="${w}" height="17" rx="3" fill="${color(c.id)}"/>`
        + (text ? `<text class="head chip${headClass(c.id)}" x="${cx + w / 2}" y="22.5" text-anchor="middle">${esc(text)}</text>` : '')
        + `<title>${esc(tipOf(c))}</title></g>`;
      cx += w + GAP;
      return chip;
    }).join('');
    return `<g><rect ${box} fill="none" stroke="${css('--fresh')}"/>${chips}`
      + `<text class="muted" x="${x}" y="41" text-anchor="middle">${list.length} contexts, one after another</text></g>`;
  }
  // Activation: a context is busy from the call that starts it to its return.
  for (const c of D.contexts) {
    const x = lx.get(c.id);
    const call = callOf.get(c.id);
    const y0 = c.id === 'main' ? SEQ_HEAD + 4 : yOf(rowOf.get(`call${call}`));
    const y1 = c.id === 'main' ? height - 6 : yOf(rowOf.get(`return${call}`) ?? rows.length);
    s += `<rect x="${x - 5}" y="${y0}" width="10" height="${Math.max(4, y1 - y0)}" fill="${color(c.id)}" fill-opacity=".85" rx="2"${c.hue === 0 ? ` ${ROOT_BAR}` : ''}><title>${esc(tipOf(c) + (c.spent ? `\n${spentTip(c)}` : ''))}</title></rect>`;
    // What the context spent sits next to the top of its bar: right of a
    // subagent's, where the call message arrives from the left, and left of
    // main's, which nothing else uses. Three rows, numbers right-aligned.
    if (c.spent) {
      const left = c.id === 'main';
      const numX = left ? x - 64 : x + 58;
      const parts = [['new', c.spent.new], ['cached', c.spent.cached], ['out', c.spent.out]];
      s += `<g class="spent">${parts.map(([word, n], k) => `<text x="${numX}" y="${y0 + 10 + k * 13}" text-anchor="end">${esc(count(n))}</text>`
        + `<text class="kind" x="${numX + 4}" y="${y0 + 10 + k * 13}">${word}</text>`).join('')}<title>${esc(spentTip(c))}</title></g>`;
    }
  }
  rows.forEach((e, r) => {
    const y = yOf(r);
    const t = e.type === 'note' ? e.m.at : e.t;
    s += `<text class="muted mono" x="8" y="${y + 4}">${clock(new Date(t))}</text>`;
    if (e.type === 'note') {
      const x = lx.get(e.at);
      s += `<rect x="${x + 10}" y="${y - 11}" width="${Math.min(colW - 20, 170)}" height="22" fill="${css('--panel')}" stroke="${css('--fg')}" stroke-width="1.5"/>`;
      s += `<text x="${x + 18}" y="${y + 4}">compacted (${esc(e.m.trigger || '?')})</text>`;
      return;
    }
    if (e.type === 'group') {
      const x = lx.get(e.at) + 5;
      const names = e.is.map((i) => shownName(D.calls[i].tool, D.calls[i].name) || 'skill');
      const text = `${e.is.length} skills: ${names.join(', ')}`;
      s += `<g class="hit" data-group="${e.is[0]}"><path d="M${x + 12} ${y - 7} l7 7 l-7 7 l-7 -7 z" fill="${color(e.at)}"/>`
        + `<text x="${x + 26}" y="${y + 4}">${esc(clip(text, fits(x + 26 > W - colW ? W - x - 36 : colW - 40)))}</text>`
        + `<title>${esc(`${e.is.length} skills loaded inline, ${clock(new Date(D.calls[e.is[0]].start))} to ${clock(new Date(D.calls[e.is.at(-1)].start))}:\n${names.join('\n')}\nClick to show each one.`)}</title></g>`;
      return;
    }
    const c = D.calls[e.i];
    const tip = `<title>${esc(`${label(c.tool, c.name)} · ${clock(new Date(c.start))} · ${took(c)}${c.ok ? '' : ' · failed'}${c.model ? ` · ${c.model}` : ''}${c.result ? `\n-> ${c.result}` : ''}`)}</title>`;
    if (e.type === 'self') {
      const x = lx.get(e.at) + 5, inline = c.tool === 'Skill';
      const name = shownName(c.tool, c.name) || kindWord(c.tool), kind = ` (${kindWord(c.tool)})`;
      s += `<g class="hit" data-i="${e.i}">`
        + (inline ? `<path d="M${x + 12} ${y - 7} l7 7 l-7 7 l-7 -7 z" fill="${color(e.at)}"/>`
          : `<path d="M${x} ${y - 6} h18 v12 h-14" fill="none" stroke="${css('--muted')}" marker-end="url(#head-self)"/>`)
        + `<text class="${c.ok ? '' : 'failtext'}" x="${x + 26}" y="${y + 4}">${esc(clip(name, fits(x + 26 > W - colW ? W - x - 36 : colW - 40) - kind.length))}<tspan class="kind">${esc(kind)}</tspan></text>${tip}</g>`;
      return;
    }
    const x0 = lx.get(e.from) + (lx.get(e.to) > lx.get(e.from) ? 5 : -5);
    const x1 = lx.get(e.to) + (lx.get(e.to) > lx.get(e.from) ? -5 : 5);
    const child = byId.get(c.child);
    const isCall = e.type === 'call';
    const stroke = isCall ? color(c.ctx) : css('--muted');
    const span = Math.abs(x1 - x0);
    const name = shownName(c.tool, c.name) || kindWord(c.tool), kind = ` (${kindWord(c.tool)})`;
    const args = c.args && c.args !== c.name ? ` · ${c.args}` : '';
    // Labels start a fixed distance right of the left end, the caller's lifeline,
    const lx0 = Math.min(x0, x1) + LABEL_PAD;
    // and stop before the first bar of another context that is at work on this row.
    let end = Math.max(x0, x1) - 10;
    for (const o of D.contexts) {
      const ox = lx.get(o.id), k = callOf.get(o.id);
      const busy = o.id === 'main' || (rowOf.get(`call${k}`) < r && r < (rowOf.get(`return${k}`) ?? rows.length));
      if (busy && ox > lx0 && ox - 10 < end) end = ox - 10;
    }
    const room = fits(end - lx0);
    const body = isCall
      ? `${esc(clip(name, room - kind.length))}<tspan class="kind">${esc(kind)}${esc(clip(args, Math.max(0, room - name.length - kind.length)))}</tspan>`
      : esc(clip(`${c.result ? c.result : 'done'} · ${dur(c.dur)}`, room));
    const toHue = child.hue;
    const head = toHue === 0 ? 'main' : String(toHue % PALETTE);
    s += `<g class="hit" data-i="${e.i}"><line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="${stroke}" stroke-width="${isCall ? 2 : 1.5}"${isCall ? '' : ' stroke-dasharray="5 4"'} marker-end="url(#${isCall ? `head-${c.background ? 'open-' : ''}${head}` : 'head-return'})"/>`
      + `<text class="${isCall ? 'msg' : 'msg muted'}${c.ok || isCall ? '' : ' failtext'}" x="${lx0}" y="${y - 6}">${body}</text>`
      + (isCall && (child.kind === 'copy' || c.background) ? `<text class="muted" x="${lx0}" y="${y + 14}">${esc(clip([child.kind === 'copy' && 'starts with a copy of this history', c.background && (c.running ? 'still running in the background' : 'runs in the background')].filter(Boolean).join(', '), room))}</text>` : '')
      + `${tip}</g>`;
  });
  // UML: a filled head is a synchronous call, an open one an asynchronous call
  // the caller doesn't wait for. `head-main` is hue 0's — the accent — and every other head takes its
  // hue's own `--c${h}` through the same `hueColor` the lifelines do, so a head never disagrees with
  // the bar it points at.
  const heads = Array.from({ length: PALETTE }, (_, h) => `<marker id="head-${h}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="${hueColor(h)}"/></marker>`
    + `<marker id="head-open-${h}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="${hueColor(h)}" stroke-width="1.8"/></marker>`).join('')
    + `<marker id="head-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="${hueColor(0)}"/></marker>`
    + `<marker id="head-open-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="${hueColor(0)}" stroke-width="1.8"/></marker>`
    + `<marker id="head-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="${css('--muted')}" stroke-width="1.5"/></marker>`
    + `<marker id="head-self" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="${css('--muted')}"/></marker>`;
  svg.setAttribute('width', W); svg.setAttribute('height', height); svg.setAttribute('viewBox', `0 0 ${W} ${height}`);
  svg.innerHTML = `<defs>${heads}</defs>${s}`;
}

// ---------- tree ----------

// Same nesting as `devpro profiler tree`: a subagent's calls go under the call that started it.
const kids = new Map();
const containerKey = (ctx) => (ctx === 'main' || !D.calls.some((c) => c.child === ctx) ? `root` : ctx);
const items = D.calls.map((c, i) => ({ type: 'call', i, start: c.start, ctx: c.ctx }))
  .concat(D.markers.filter((m) => m.kind === 'compact').map((m) => ({ type: 'compact', m, start: m.at, ctx: m.ctx })));
for (const it of items) {
  const key = containerKey(it.ctx);
  if (!kids.has(key)) kids.set(key, []);
  kids.get(key).push(it);
}
for (const list of kids.values()) list.sort((a, b) => a.start - b.start);

const ctxName = (id) => (byId.get(id) ? `${byId.get(id).label}${id === 'main' ? '' : ` (${short(id)})`}` : id);
// An inline skill returns nothing: its text joins the caller's context, and
// the calls that context makes next are its work, mixed with the caller's own.
const resultText = (c) => (c.result ? c.result
  : c.running ? 'none yet: it is still running'
  : c.tool === 'Skill' && !c.child ? `none of its own: it ran inline, so its work is the calls ${ctxName(c.ctx)} makes after it`
  : '(none recorded)');
// The same square-root scale as the text tree: the longest call fills the bar.
const barWidth = (ms, longest) => (longest && ms ? Math.max(1, Math.round(Math.sqrt(Math.min(ms, longest) / longest) * 66)) : 0);

// One row per item is drawn here: a call only when shownCall keeps it, a compaction always.
// The default view falls back to every call when it would otherwise draw none, so a session of
// nothing but tool calls shows those calls rather than a header row with no rows under it. The
// fallback reads the drawing itself, so it holds for any reason a default view comes up empty.
function drawTree() {
  const requested = document.getElementById('all').checked;
  const drawn = (show) => {
    const rows = [];
    const walk = (key) => (kids.get(key) || []).forEach((it) => {
      const c = it.type === 'compact' ? null : D.calls[it.i];
      if (c && !show(c)) return;
      rows.push(it);
      if (c && c.child) walk(c.child);
    });
    walk('root');
    return rows;
  };
  const asSkillAndAgent = (c) => c.tool === 'Skill' || c.tool === 'Agent';
  const fallback = !requested && drawn(asSkillAndAgent).length === 0;
  const shownCall = (c) => requested || fallback || asSkillAndAgent(c);
  const longest = Math.max(0, ...D.calls.filter(shownCall).map((c) => c.dur));
  let h = '<div class="thead"><span>time</span><span class="num">duration</span><span></span><span class="num">new</span><span class="num">cached</span><span class="num">out</span><span>call</span></div>';
  const walk = (key, depth) => (kids.get(key) || []).forEach((it) => {
    const pad = depth * 22;
    if (it.type === 'compact') {
      h += `<div class="row mark"><span>${clock(new Date(it.m.at))}</span><span></span><span></span><span></span><span></span><span></span>`
        + `<span class="call" style="padding-left:${pad}px">-- ${esc(short(it.ctx))} compacted (${esc(it.m.trigger || 'unknown trigger')})</span></div>`;
      return;
    }
    const c = D.calls[it.i];
    const shown = shownCall(c);
    if (shown) {
      const spent = c.child && spentOf(c.child);
      const chipOf = c.child && byId.has(c.child) ? c.child : c.ctx;
      const hue = color(chipOf);
      // The dispatch links to the child session's page, where the record's harness names one; a page
      // the dashboard serves nothing at answers its 404 like any unrecorded session's.
      const name = `<b>${esc(shownName(c.tool, c.name) || kindWord(c.tool))}</b>`;
      h += `<div class="row" id="r${it.i}" data-i="${it.i}"><span class="muted">${clock(new Date(c.start))}</span><span class="num">${esc(took(c))}</span>`
        + `<span class="bar"><i style="width:${barWidth(c.running ? 0 : c.dur, longest)}px;background:${hue}"></i></span>`
        + (spent ? [spent.new, spent.cached, spent.out].map((n) => `<span class="num" title="${n}">${count(n)}</span>`).join('') : '<span></span><span></span><span></span>')
        + `<span class="call" style="padding-left:${pad}px"><i class="chip" style="background:${hue}"></i>`
        + `<span>${c.childPage ? `<a href="${esc(c.childPage)}">${name}</a>` : name}${c.name ? ` (${esc(kindWord(c.tool))})` : ''}</span>`
        + `<span class="words">${esc(words(c))}</span>${c.ok ? '' : '<span class="fail">failed</span>'}<span class="gist">${esc(gist(c))}</span></span></div>`;
      h += `<div class="detail" id="d${it.i}" hidden style="margin-left:${pad + 20}px;border-color:${color(c.ctx)}">`
        + `<b>context</b>${esc(ctxName(c.ctx))}\n`
        + (c.model ? `<b>model</b>${esc(c.model)}\n` : '')
        + (c.ctxTokens ? `<b>history</b>${esc(tok(c.ctxTokens))} in the context when it made this call\n` : '')
        + (c.args ? `<b>args</b>${esc(c.args)}\n` : '')
        + `<b>result</b>${esc(resultText(c))}</div>`;
    }
    if (c.child) walk(c.child, depth + (shown ? 1 : 0));
    // The depth-2 chain: beneath a dispatch's context, the agents the child dispatched of its own,
    // each named after the call that dispatched it and linked to its page where the child's own
    // record names one. These are the chain's floor: the agents' own dispatches are not drawn. The
    // fan-out mark is not here — it stands on the page of the session that opened the fan-out, in
    // its header line, beside the fact that it recorded no review of what it dispatched.
    const downstream = c.child ? D.children.find((child) => child.id === c.child) : null;
    if (shown && downstream && downstream.agents.length) {
      h += `<div class="row sub" style="padding-left:${pad + 22}px"><span></span><span></span><span></span><span></span><span></span><span></span>`
        + `<span class="call">${downstream.agents.map((a) => (a.childPage
          ? `<a href="${esc(a.childPage)}">${esc(shownName(a.tool, a.name) || kindWord(a.tool))}</a>`
          : esc(shownName(a.tool, a.name) || kindWord(a.tool)))).join(', ')}</span></div>`;
    }
  });
  walk('root', 0);
  document.getElementById('tree').innerHTML = h;
}

function select(i, fromTimeline) {
  if (fromTimeline && !document.getElementById(`r${i}`)) { document.getElementById('all').checked = true; drawTree(); drawSequence(); }
  const row = document.getElementById(`r${i}`), detail = document.getElementById(`d${i}`);
  document.querySelectorAll('.row.sel').forEach((r) => r.classList.remove('sel'));
  row.classList.add('sel');
  detail.hidden = fromTimeline ? false : !detail.hidden;
  if (fromTimeline) row.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

document.getElementById('tree').addEventListener('click', (e) => { const r = e.target.closest('.row'); if (r) select(r.dataset.i, false); });
document.getElementById('tl').addEventListener('click', (e) => {
  const b = e.target.closest('.hit');
  if (b && b.dataset.group) { expanded.add(Number(b.dataset.group)); drawSequence(); } else if (b) select(b.dataset.i, true);
});
document.getElementById('all').addEventListener('change', () => { drawTree(); drawSequence(); });
let pending;
window.addEventListener('resize', () => { clearTimeout(pending); pending = setTimeout(drawSequence, 100); });
if (D.calls.length) drawSequence(); else document.querySelector('.panel').textContent = 'No calls recorded in this session.';
drawTree();
})();
</script></body></html>
