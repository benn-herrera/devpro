[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devpro"
dynamic = ["version"]
description = "Devpro renders agent, command and skill definitions to order, for any supported harness and model family, from one source in which text definitions share is written once"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devpro = "devpro.cli:main"

[project.urls]
Repository = "https://github.com/benn-herrera/devpro"

# The dev toolchain `.venv` runs (PEP 735): a dependency group is development-only and never
# distribution metadata, so no wheel of this package carries or installs it. The line convention and
# the group's record are stated in `PROJECT_DOCS/ARCHITECTURE/packaging.md`.
[dependency-groups]
dev = [
    "pytest~=9.2",
    "isort~=9.0",
    "black~=26.10",
    "flake8~=7.5",
    "setuptools~=84.2",
    "build~=1.6",
]

[tool.setuptools.packages.find]
include = ["devpro", "devpro.*"]

[tool.setuptools.package-data]
devpro = [
    "kb-tools/**/*",
    "runner-snippets/**/*",
    "harnesses/resources/**/*",
    "development-tools/**/*",
    "kanban/assets/**/*",
    "profiler/view.html",
    "profiler/deco.js",
]

[tool.setuptools.dynamic]
version = { attr = "devpro.__version__" }

[tool.pytest.ini_options]
# Keep pytest's cache out of the project root: it writes under the scratch directory instead, so a
# test run leaves no `.pytest_cache` beside the source. See `PROJECT_DOCS/CONVENTIONS/` — "Scratch
# for tests and recipes".
cache_dir = ".devpro-temp/.pytest_cache"
markers = [
    "cold_read: the shipped cold-read.sh suite, one test per subprocess case — a rare manual surface (`just test cold-read`), excluded from the default run",
    "slow: a test that earns its cost but not its place in the default run — the screenshot suite today (`just test slow`), excluded from the default run",
]
